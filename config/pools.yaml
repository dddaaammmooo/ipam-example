# IPAM pool definitions (source of truth for address space).
#
# Read by the easytofu/github-ipam provider. Changes go through a pull
# request reviewed by CODEOWNERS; CI checks every CIDR is valid, private
# (RFC 1918), does not overlap another pool, and that pool IDs follow the
# naming convention below.
#
# Naming convention:  <scope>-<kind>-<N>
#   scope  an AWS region (eu-west-1), or "global" for pools not tied to one
#   kind   prd | stg | dev for environments; shared | overlay | reserved
#   N      1, 2, ... a new pool is opened when the previous one is full
#
# Pool IDs are permanent: allocations and Terraform stacks reference them,
# and changing an allocation's pool_id replaces it (new CIDR). Stacks pin
# the pool per VPC, so opening -2 never moves anything already on -1.
#
# Layout of 10.0.0.0/8:
#   10.0.0.0/12   eu-west-1-prd-1       FULL (1,048,576 of 1,048,576)
#   10.16.0.0/12  eu-west-1-prd-2       opened when -1 filled; same /11 as
#                                       -1, so eu-west-1 prd still
#                                       summarises as 10.0.0.0/11
#   10.32.0.0/12  ap-southeast-2-prd-1
#   10.48.0.0/13  eu-west-1-stg-1
#   10.56.0.0/13  ap-southeast-2-stg-1
#   10.64.0.0/12  global-dev-1          (dev is not split by region)
#   10.80.0.0/16  global-shared-1
#   10.81.0.0 - 10.127.255.255          unassigned: next pools come from here
#   10.128.0.0/9  global-reserved-1     (no allocations allowed)

pools:
  eu-west-1-prd-1:
    cidr: ["10.0.0.0/12"]
    description: "prd VPCs in eu-west-1 (full: new VPCs go to eu-west-1-prd-2)"
    metadata:
      environment: prd
      region: eu-west-1
      owner: platform

  eu-west-1-prd-2:
    cidr: ["10.16.0.0/12"]
    description: "prd VPCs in eu-west-1, opened when eu-west-1-prd-1 filled"
    metadata:
      environment: prd
      region: eu-west-1
      owner: platform

  ap-southeast-2-prd-1:
    cidr: ["10.32.0.0/12"]
    description: "prd VPCs in ap-southeast-2"
    metadata:
      environment: prd
      region: ap-southeast-2
      owner: platform

  eu-west-1-stg-1:
    cidr: ["10.48.0.0/13"]
    description: "stg VPCs in eu-west-1"
    metadata:
      environment: stg
      region: eu-west-1
      owner: platform

  ap-southeast-2-stg-1:
    cidr: ["10.56.0.0/13"]
    description: "stg VPCs in ap-southeast-2"
    metadata:
      environment: stg
      region: ap-southeast-2
      owner: platform

  global-dev-1:
    cidr: ["10.64.0.0/12"]
    description: "dev and sandbox VPCs, all regions"
    metadata:
      environment: dev
      owner: platform

  global-shared-1:
    cidr: ["10.80.0.0/16"]
    description: "Transit gateway, VPN, DNS resolvers, inspection VPCs"
    metadata:
      environment: shared
      owner: network

  # A pool may hold several CIDRs; allocations fill the first one before
  # moving on. Here the 172.16/12 range is kept for container overlays.
  global-overlay-1:
    cidr: ["172.16.0.0/13", "172.24.0.0/14"]
    description: "Kubernetes pod and service ranges that never leave the cluster"
    metadata:
      environment: any
      owner: platform

  global-reserved-1:
    cidr: ["10.128.0.0/9"]
    description: "Held back for acquisitions and future regions"
    reserved: true
    metadata:
      owner: network

  # Commonly used by home routers and office LANs. Reserved so no VPC is
  # ever allocated here and clashes with a VPN client's local network.
  global-reserved-2:
    cidr: ["192.168.0.0/16"]
    description: "Never allocate: overlaps typical home/office LANs"
    reserved: true
    metadata:
      owner: network

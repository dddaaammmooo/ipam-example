# Product network catalogue: 20 products x 3 environments = 60 VPCs.
#
# Each product gets one VPC per environment, carved into subnets per tier,
# one subnet per AZ (3 AZs). Numbers are prefix lengths: smaller number =
# bigger block (/16 = 65,536 addresses, /20 = 4,096, /24 = 256, /28 = 16).
#
#   vpc:      size of the VPC block taken from the environment's pool
#   accounts: AWS account that runs this product in each environment; the
#             VPC and subnet CIDRs are published to SSM Parameter Store
#             there (ssm.tf). The IDs below are FAKE placeholders.
#   subnets:  tier -> size of EACH subnet (x3, one per AZ)
#
# Sizing rules used here:
#   - prd is the biggest; stg is roughly 1/4 of prd; dev roughly 1/8.
#   - each VPC is the smallest power of two that holds its subnets with
#     room to spare, so subnets always fit whatever order they're created in.
#   - AWS limits: a subnet is /16 to /28, and a VPC CIDR block is at most
#     /16. Products with a VPC bigger than /16 (the /14 and /15 ones) attach
#     it as several /16 blocks (see aws_vpc_cidr_blocks in outputs.tf).
#
# Tiers:
#   compute  instances, containers, EKS nodes and pods
#   data     databases, caches, queues
#   public   load balancers and NAT gateways

products:

  # ---- massive ---------------------------------------------------------
  media-streaming:
    size: massive
    team: media
    description: Live and on-demand video origin, packagers and edge caches
    vpc:     { prd: 14, stg: 16, dev: 17 }
    accounts: { prd: "100000010301", stg: "100000010201", dev: "100000010101" }
    subnets:
      compute: { prd: 16, stg: 18, dev: 19 }   # prd: 3 x 65,536
      public:  { prd: 20, stg: 22, dev: 23 }
      data:    { prd: 22, stg: 24, dev: 25 }

